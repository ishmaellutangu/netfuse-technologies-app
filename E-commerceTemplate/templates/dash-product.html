<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/css/dashboard.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <button class="menu-btn" id="p">&#9776</button>
        <h1>Product Management</h1>
        <form class="search">
          <input type="search" placeholder="Search…" required />
          <button type="submit">
            <svg viewBox="0 0 24 24">
              <path
                d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"                
              />
            </svg>
          </button>
        </form>
        <div class="profile-menu">
          <button class="profile-btn" aria-haspopup="true" aria-expanded="false" aria-controls="profileDropdown">
            <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="profile" class="profile-pic">
          </button>
          <div id="profileDropdown" class="profile-dropdown" role="menu" aria-hidden="true">
            <a href="#" role="menuitem">My Profile</a>
            <a href="#" role="menuitem">Settings</a>
            <a href="#" role="menuitem">Logout</a>
          </div>
        </div>
    </header>
    
      <div class="page-content">
        <h2>Manage All Your Products Here</h2>
        <div class="add-product-container">
          <h3>Add New Product</h3>
          <form class="add-product-form">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" name="productName" required />

            <label for="productPrice">Price:</label>
            <input type="number" id="productPrice" name="productPrice" required />

            <label for="productStock">Stock Quantity:</label>
            <input type="number" id="productStock" name="productStock" required />

            <label for="productDescription">Description:</label>
            <textarea id="productDescription" name="productDescription" required></textarea>

            <label for="product-image">Product Image</label>
            <input type="file" id="product-image" name="product-image" accept="image/*" />

            <button class="btn1" type="submit">Add Product</button>
          </form>  
        </div>
      </div>
    </main>
  </body>
</html>
