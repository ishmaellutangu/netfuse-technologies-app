<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMN | Admin Dashboard</title>
    <link rel="stylesheet" href="../static/css/dashboard.css" />
    <script
      src="https://kit.fontawesome.com/1a60db1b94.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">Shop <span class="logo-accent">Admin</span></span>
        <button class="close-sidebar" id="closeSidebar">&times</button>
        <!-- Dark mode toggle -->
        <div class="dark-mode-toggle">
          <input type="checkbox" id="darkModeToggle" />
          <label for="darkModeToggle" class="dark-mode-label">Dark</label>
        </div>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li>
            <a href="dash-main.html" target="content-loader"
              ><i class="icon fa-solid fa-house"></i>Dashboard</a
            >
          </li>
          <li>
            <a href="dash-product.html" target="content-loader"
              ><i class="icon fa-solid fa-box"></i>Product</a
            >
          </li>
          <li>
            <a href="#"><i class="icon fa-solid fa-cart-shopping"></i>Orders</a>
          </li>
          <li>
            <a href="#"><i class="icon fa-solid fa-users"></i>Customers</a>
          </li>
          <li>
            <a href="#"><i class="icon fa-solid fa-chart-line"></i>Analytics</a>
          </li>
          <li>
            <a href="#"><i class="icon fa-solid fa-gear"></i>Settings</a>
          </li>
        </ul>
      </nav>
    </aside>
    <div class="frame-container">
      <iframe
        name="content-loader"
        src="dash-main.html"
        style="border: none; min-width: 100%; min-height: 100vh"
        frameborder="0"
      ></iframe>
    </div>

    <script src="../static/Javascript/dashboard.js"></script>
  </body>
</html>
